name: Deploy to GitHub Pages

# main への push で本番サイトをビルドし、gh-pages ブランチの直下に配置する。
# GitHub Pages は gh-pages ブランチから配信する設定にしておく（Settings → Pages → Deploy from a branch）。
# PR プレビュー（.github/workflows/preview.yml）は同じブランチの pr-preview/ 配下に置かれるので、
# ここでは clean-exclude で消さないようにしている。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6 # package.json の packageManager からバージョンを読む

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          # PR プレビューは消さない
          clean-exclude: pr-preview/
          # force push すると進行中の PR プレビューを巻き戻してしまうので rebase する
          force: false
          commit-message: "Deploy ${{ github.sha }}"
